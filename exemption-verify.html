<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>断签豁免 · 打卡工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 35%, #334155 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-tap-highlight-color: transparent;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.06) 100%);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }
        .card.success { border-color: rgba(34, 197, 94, 0.4); background: linear-gradient(180deg, rgba(34, 197, 94, 0.15) 0%, rgba(34, 197, 94, 0.05) 100%); }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 1rem;
            margin-bottom: 0.75rem;
        }
        .info-row .label { font-size: 0.75rem; color: #94a3b8; min-width: 3.2em; }
        .info-row .value { font-weight: 600; color: #f1f5f9; }
        .btn {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 1.25rem;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }
        .success-state { display: none; text-align: center; }
        .success-state.visible { display: block; }
        .confirm-state.hidden { display: none; }
        .icon-done {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #34d399, #10b981);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            animation: scaleIn 0.4s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .code-box {
            background: rgba(0,0,0,0.35);
            border: 2px dashed rgba(34, 197, 94, 0.5);
            border-radius: 1rem;
            padding: 1.25rem;
            margin: 1rem 0;
        }
        .code-box .hint { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.5rem; }
        .code-box .code {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.35em;
            color: #34d399;
            text-align: center;
            user-select: all;
        }
        .time { font-size: 0.8rem; color: #94a3b8; margin-top: 0.75rem; }
        .footer-note { font-size: 0.75rem; color: #64748b; margin-top: 1.5rem; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h1>🛡️ 断签豁免</h1>
        <p class="sub">监护人确认 · 打卡工具</p>

        <div class="confirm-state" id="confirmState">
            <div class="info-row">
                <span class="label">孩子</span>
                <span class="value" id="account">—</span>
            </div>
            <div class="info-row">
                <span class="label">日期</span>
                <span class="value" id="dateStr">—</span>
            </div>
            <p class="footer-note">确认后，该日断签将被豁免，算作全勤。请核实情况（如生病、特殊假期等）后再操作。</p>
            <button class="btn btn-primary" id="confirmBtn">确认豁免</button>
        </div>

        <div class="success-state" id="successState">
            <div class="icon-done">✓</div>
            <p style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.25rem;">豁免确认成功</p>
            <p class="footer-note">请将下方豁免码输入电脑/平板上的主程序，完成同步。</p>
            <div class="code-box">
                <div class="hint">豁免码</div>
                <div class="code" id="displayCode">—</div>
            </div>
            <div class="time" id="verifyTime">—</div>
        </div>
    </div>

    <script type="module">
        import { SYNC_WORKER_URL } from "/src/constants/api.js";
        import { getDeviceFingerprint } from "/src/utils/deviceFingerprint.js";

        (async function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code') || '';
            var account = params.get('account') ? decodeURIComponent(params.get('account')) : '—';
            var dateStr = params.get('date') ? decodeURIComponent(params.get('date')) : '—';
            var family = params.get('family') || '';

            document.getElementById('account').textContent = account;
            document.getElementById('dateStr').textContent = dateStr;

            var confirmState = document.getElementById('confirmState');
            var successState = document.getElementById('successState');
            var card = document.getElementById('card');
            var confirmBtn = document.getElementById('confirmBtn');

            // 权限状态提示容器
            var authNotice = document.createElement('div');
            authNotice.style.margin = '0 0 1rem 0';
            authNotice.style.padding = '0.75rem 1rem';
            authNotice.style.borderRadius = '0.75rem';
            authNotice.style.fontSize = '0.75rem';
            authNotice.style.lineHeight = '1.4';
            confirmBtn.before(authNotice);

            let isAuthorized = true;
            let authorizedRole = '家长';

            if (family) {
                authNotice.style.background = 'rgba(255,255,255,0.08)';
                authNotice.style.color = '#94a3b8';
                authNotice.innerHTML = '⏳ 正在核验家长手机绑定权限...';
                confirmBtn.disabled = true;

                try {
                    const localDevId = localStorage.getItem('parent_device_id') || '';
                    const localFp = getDeviceFingerprint();

                    // 从同步服务读取家庭快照
                    const endpoint = SYNC_WORKER_URL || '';
                    const res = await fetch(`${endpoint}?code=${encodeURIComponent(family)}`, { cache: 'no-store' });
                    if (res.ok) {
                        const data = await res.json();
                        let authConfig = { devices: [], revokedDevices: {} };
                        try {
                            if (data.app_authorized_parents_v1) {
                                authConfig = JSON.parse(data.app_authorized_parents_v1);
                            }
                        } catch (e) {}

                        const devices = authConfig.devices || [];
                        if (devices.length > 0) {
                            // 检查当前设备是否在绑定列表中（支持多沙盒聚合凭据与指纹）
                            const matched = devices.find(d => {
                                if (!d) return false;
                                if (localDevId && (d.deviceId === localDevId || (Array.isArray(d.authorizedDeviceIds) && d.authorizedDeviceIds.includes(localDevId)))) return true;
                                if (localFp && d.fingerprint === localFp) return true;
                                return false;
                            });

                            const revoked = authConfig.revokedDevices || {};
                            const isRevoked = Boolean((localDevId && revoked[localDevId]) || (localFp && revoked[localFp]));

                            if (!matched || isRevoked) {
                                isAuthorized = false;
                                authNotice.style.background = 'rgba(239, 68, 68, 0.15)';
                                authNotice.style.border = '1px solid rgba(239, 68, 68, 0.4)';
                                authNotice.style.color = '#fca5a5';
                                authNotice.innerHTML = '🔒 <b>未受信任的家长设备</b><br>断签豁免仅限已绑定的家长手机。当前手机尚未绑定为该家庭的家长手机，无法豁免。<br><br>💡 请使用电脑主程序【设置】→【家长专属手机看板】扫描绑定本手机后再试。';
                                confirmBtn.style.display = 'none';
                                return;
                            } else {
                                authorizedRole = matched.role || '家长';
                                authNotice.style.background = 'rgba(16, 185, 129, 0.15)';
                                authNotice.style.border = '1px solid rgba(16, 185, 129, 0.4)';
                                authNotice.style.color = '#6ee7b7';
                                authNotice.innerHTML = `✅ <b>已核验家长身份：【${authorizedRole}】</b>（专属授权手机）`;
                                confirmBtn.disabled = false;
                            }
                        } else {
                            // 未配置家长绑定设备（单机/未绑定状态）
                            authNotice.style.background = 'rgba(245, 158, 11, 0.15)';
                            authNotice.style.border = '1px solid rgba(245, 158, 11, 0.3)';
                            authNotice.style.color = '#fcd34d';
                            authNotice.innerHTML = '⚠️ 该家庭尚未绑定家长专属手机，建议在主程序设置中扫码绑定以开启防篡改护航。';
                            confirmBtn.disabled = false;
                        }
                    } else {
                        confirmBtn.disabled = false;
                    }
                } catch (e) {
                    // 网络不可用时允许降级
                    confirmBtn.disabled = false;
                }
            }

            confirmBtn.addEventListener('click', function() {
                if (!isAuthorized) {
                    alert('未受信任的家长设备，无权核销。请先在主程序中绑定本手机。');
                    return;
                }
                if (!code) {
                    alert('缺少参数，请从主程序重新打开。');
                    return;
                }
                confirmState.classList.add('hidden');
                successState.classList.add('visible');
                card.classList.add('success');

                document.getElementById('displayCode').textContent = code;
                var now = new Date();
                document.getElementById('verifyTime').textContent = `确认人：${authorizedRole} · 时间：${now.toLocaleString('zh-CN')}`;
            });
        })();
    </script>
</body>
</html>
