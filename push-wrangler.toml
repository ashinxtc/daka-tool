# Web Push 通知 Worker 配置
# 独立于现有 cloudflare-worker.js（同步服务）和 wecom-worker.js（企业微信）
name = "daka-push"
main = "push-worker.js"
compatibility_date = "2024-01-01"

# Keep notifications on the authoritative sync backend after the KV cutover.
[[services]]
binding = "SYNC_SERVICE"
service = "daka-sync"

# 定时任务：每天 8:00, 16:00, 20:00 检查
[triggers]
crons = ["0 0 * * *", "0 8 * * *", "0 12 * * *"]

# VAPID 密钥（通过 wrangler secret 设置）
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_PRIVATE_KEY_HEX

# KV 命名空间（推送订阅存储）
# 创建命令：wrangler kv namespace create PUSH_KV
[[kv_namespaces]]
binding = "PUSH_KV"
id = "86b53facf1524386b2ed740e7cd101a6"

# PUSH_SERVICE_SECRET: identical Worker secrets on sync and push; never browser config.
# OPERATIONS_TOKEN: separate operations secret for manual debug endpoints.
# No direct family KV access: push can read only its signed reminder projection.
