# Web Push 通知 Worker 配置
# 独立于现有 cloudflare-worker.js（同步服务）和 wecom-worker.js（企业微信）
name = "daka-push"
main = "push-worker.js"
compatibility_date = "2024-01-01"

# 定时任务：每天 8:00, 16:00, 20:00 检查
[triggers]
crons = ["0 8 * * *", "0 16 * * *", "0 20 * * *"]

# VAPID 密钥（通过 wrangler secret 设置）
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_PRIVATE_KEY_HEX

# KV 命名空间（推送订阅存储）
# 创建命令：wrangler kv namespace create PUSH_KV
[[kv_namespaces]]
binding = "PUSH_KV"
id = "86b53facf1524386b2ed740e7cd101a6"

# 同步 KV（读取打卡数据）
# 复用现有 daka-sync 的 KV namespace
[[kv_namespaces]]
binding = "DAKA_SYNC"
id = "d5f0e4601ff84b3e908ff248042d78a2"
