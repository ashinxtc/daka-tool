name = "daka-sync"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

[vars]
# Production migration completed: preserve the authoritative DO and device gate.
# Emergency maintenance uses SYNC_MODE="paused", never legacy KV writes.
SYNC_MODE = "active"
AUTH_MODE = "enforced"
# The protected exchange protocol retains the historical "preview" enum value.
EXCHANGE_MODE = "preview"
# PUSH_SERVICE_SECRET must be injected as a Worker secret, matching daka-push.

[[durable_objects.bindings]]
name = "SYNC_FAMILIES"
class_name = "SyncFamily"

[[migrations]]
tag = "sync-v2-sqlite"
new_sqlite_classes = ["SyncFamily"]

[[kv_namespaces]]
binding = "DAKA_SYNC"
id = "d5f0e4601ff84b3e908ff248042d78a2"

# Trusted public market data; never forwards device credentials.
[[services]]
binding = "EXCHANGE_MARKET_SERVICE"
service = "daka-exchange"
