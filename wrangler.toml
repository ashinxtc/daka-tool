name = "daka-sync"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

[vars]
# Deploy read-only first; follow docs/sync-consistency.md before switching to active.
SYNC_MODE = "readonly"
# Security foundation only: keep legacy until all clients and service bindings
# complete the migration checklist in docs/service-authorization.md.
AUTH_MODE = "legacy"
# Isolated migration preview only. No production exchange cutover yet.
EXCHANGE_MODE = "off"

[[durable_objects.bindings]]
name = "SYNC_FAMILIES"
class_name = "SyncFamily"

[[migrations]]
tag = "sync-v2-sqlite"
new_sqlite_classes = ["SyncFamily"]

[[kv_namespaces]]
binding = "DAKA_SYNC"
id = "d5f0e4601ff84b3e908ff248042d78a2"
