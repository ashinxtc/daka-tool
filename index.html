    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        /* ===== 甲骨文 Loading 页面样式 ===== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease-out;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        .oracle-text {
            font-family: '方正甲骨文.TTF', 'FZXJRW', 'STKaiti', 'KaiTi', serif;
            font-size: clamp(4rem, 20vw, 12rem);
            color: #cd7f32;
            letter-spacing: 0.2em;
            line-height: 1.4;
            animation: bronzeToGold 4s linear forwards;
        }
        @keyframes bronzeToGold {
            0% {
                color: #cd7f32;
                text-shadow: 0 0 5px rgba(180, 100, 30, 0.2);
            }
            20% {
                color: #c77b35;
                text-shadow: 0 0 10px rgba(199, 123, 53, 0.3);
            }
            40% {
                color: #c19040;
                text-shadow: 0 0 12px rgba(193, 144, 64, 0.35);
            }
            55% {
                color: #d4a030;
                text-shadow: 0 0 15px rgba(212, 160, 48, 0.4);
            }
            70% {
                color: #e8b840;
                text-shadow: 0 0 18px rgba(232, 184, 64, 0.5);
            }
            82% {
                color: #f0c050;
                text-shadow: 0 0 22px rgba(240, 192, 80, 0.6);
            }
            92% {
                color: #f5c860;
                text-shadow: 0 0 25px rgba(245, 200, 96, 0.7);
            }
            100% {
                color: #FFD700;
                text-shadow: 0 0 35px rgba(255, 215, 0, 0.9), 0 0 70px rgba(255, 180, 0, 0.5);
            }
        }
        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 40px;
        }
        .loading-dots span {
            width: 12px;
            height: 12px;
            background: #cd7f32;
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        /* ===== Loading 样式结束 ===== */
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 成就墙介绍文字区域：细滚动条，不抢眼 */
        .achievement-desc-scroll::-webkit-scrollbar { width: 4px; }
        .achievement-desc-scroll::-webkit-scrollbar-track { background: transparent; }
        .achievement-desc-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
        .achievement-desc-scroll { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }

        .text-stroke { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; }
        
        /* 徽章流光特效 */
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .badge-legendary {
            background: linear-gradient(135deg, #a855f7 0%, #d8b4fe 50%, #a855f7 100%);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            will-change: background-position;
        }
        
        /* 邪恶转盘特效 */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 10px rgba(220, 38, 38, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8); }
            50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.9); }
        }
        .evil-glow {
            animation: pulse-red 3s infinite;
            will-change: box-shadow;
        }

		@keyframes rain {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(200px); opacity: 0; }
        }
        @keyframes snow {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(200px) translateX(20px); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 升级动画特效 */
        @keyframes level-up-ping {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-level-up {
            animation: level-up-ping 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            will-change: transform, opacity;
        }

        /* 首页卡片流光边框 */
        @keyframes border-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .animate-border-flow {
            background-size: 200% 200%;
            animation: border-flow 4s ease infinite;
            will-change: background-position;
        }
        
        /* 随机事件卡片浮动 */
        @keyframes float-event {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float-event 3s ease-in-out infinite;
            will-change: transform;
        }

        /* 惊喜大转盘就绪特效 */
        @keyframes ready-pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); transform: scale(1); }
        }
        .animate-ready-pulse {
            animation: ready-pulse 2s infinite;
            background: linear-gradient(45deg, #fffbeb, #fef3c7);
            border-color: #f59e0b;
            will-change: box-shadow, transform;
        }

        /* 打卡日历：必做项今日未打卡时的呼吸提示（与必做色系一致） */
        @keyframes breathe-daily {
            0%, 100% { opacity: 0.55; background-color: rgba(248, 113, 113, 0.45); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
            50% { opacity: 1; background-color: rgba(254, 202, 202, 0.85); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.12); }
        }
        .animate-breathe-daily {
            animation: breathe-daily 2.2s ease-in-out infinite;
            will-change: opacity, background-color, box-shadow;
        }

        /* 补签火焰角标：右上角闪烁 */
        @keyframes flame-flicker {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 2px rgba(251, 146, 60, 0.8)); }
            50% { opacity: 0.85; transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.9)); }
        }
        .animate-flame-flicker {
            animation: flame-flicker 1.2s ease-in-out infinite;
        }

        /* --- 市集版新增特效 --- */
        .frame-beast { border: 4px solid #78350f; border-style: dashed; box-shadow: 0 0 0 2px #d97706; }
        .frame-bronze { border: 4px solid #0f766e; border-style: double; box-shadow: 0 0 10px #2dd4bf; }

        /* --- 新版：高级牡丹流光特效 --- */
        /* 1. 头像框流光 (未选中状态) - 圆形旋转流光 */
        .frame-peony { 
            position: relative;
            border-radius: 50%;
            /* 基础边框透明，交给伪元素处理 */
            border: 2px solid transparent; 
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.4); /* 柔和的粉色光晕 */
        }
        /* 旋转的流光环 */
        .frame-peony::after {
            content: "";
            position: absolute;
            inset: -3px; /* 向外扩展一点，包围头像 */
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, #be185d 60deg, #f472b6 120deg, transparent 180deg);
            animation: spin-glow 2s linear infinite;
            /* 使用 mask 让中间镂空，只显示圆环 */
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
        }
        @keyframes spin-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- 独立的牡丹流光背景层 --- */
        .peony-bg-layer {
            position: absolute;
            inset: 0; /* 铺满父元素 */
            border-radius: 1rem;
            overflow: hidden; /* 关键：只在这里剪裁，不影响父元素外部的标签 */
            z-index: 0; /* 放在最底层 */
            background: transparent;
        }

        /* 旋转的流光（底层） */
        .peony-bg-layer::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            z-index: -2;
            background: conic-gradient(
                transparent 0deg,
                transparent 60deg,
                #db2777 100deg,
                #f9a8d4 120deg,
                #fff 125deg,
                transparent 130deg
            );
            animation: peony-border-spin 3s linear infinite;
        }

        /* 中间层：卡片本体（背景图） */
        .peony-bg-layer::after {
            content: "";
            position: absolute;
            /* inset: 3px 必须保留！这是为了留出缝隙，让底下的流光边框露出来 */
            inset: 3px; 
            
            /* 背景图设置 */
            /* 这里使用 linear-gradient 加了一层半透明白色遮罩 (0.85 -> 0.6) */
            /* 这样既能看到牡丹底纹，又不会因为图片太花而挡住上面的黑色文字 */
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            
            background-size: cover;       /* 让图片铺满 */
            background-position: center;  /* 居中显示 */
            
            border-radius: calc(1rem - 3px); /* 圆角保持 */
            z-index: -1; 
        }

        @keyframes peony-border-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
		/* --- 高级饕餮呼吸背景 (独立层) --- */
        
        /* 1. 背景容器：负责裁剪图片，但不裁剪外部的标签 */
        .bronze-bg-layer {
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            overflow: hidden; /* 关键：只裁剪背景图 */
            z-index: 0; /* 在最底层 */
            background: #ffffff; /* 白色底色 */
            /* 边框呼吸灯 */
            border: 2px solid #b45309;
            box-shadow: 0 0 15px rgba(180, 83, 9, 0.5);
            animation: bronze-border-pulse 4s infinite ease-in-out;
        }

        /* 2. 背景纹理图 (呼吸动画主体) */
        .bronze-bg-layer::after {
            content: "";
            position: absolute;
            inset: -10%; /* 比容器大一点，为了做缩放动画时不露底 */
            
            /* 替换为你的饕餮纹理图片 */
            /* background-image: url('/taotie.png'); */
            background-size: cover;
            background-position: center;
            z-index: -2;
            
            /* 核心动画：背景图本身在呼吸 */
            animation: bronze-texture-breathe 4s infinite ease-in-out;
        }

        /* 3. 遮罩层 (增强文字对比度) */
        .bronze-bg-layer::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            /* 配合背景明暗变化的遮罩 */
            background: rgba(0, 0, 0, 0.5); 
            animation: bronze-mask-breathe 4s infinite ease-in-out;
        }

        /* --- 动画定义 --- */
        
        /* 纹理呼吸：忽明忽暗 + 微微缩放 */
        @keyframes bronze-texture-breathe {
            0%, 100% { 
                filter: brightness(0.6) sepia(0.3); /* 暗状态 */
                transform: scale(1); 
            }
            50% { 
                filter: brightness(1.1) sepia(0); /* 亮状态 */
                transform: scale(1.05); /* 微微膨胀，模拟呼吸感 */
            }
        }

        /* 遮罩配合：背景亮时遮罩浅，透出纹理 */
        @keyframes bronze-mask-breathe {
            0%, 100% { background: rgba(0, 0, 0, 0.6); }
            50% { background: rgba(0, 0, 0, 0.3); }
        }

        /* 边框配合：同步发光 */
        @keyframes bronze-border-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(180, 83, 9, 0.3); border-color: #78350f; }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); border-color: #f59e0b; }
        }

        /* --- Goldcloud 头像框样式 (饕餮纹铜框) --- */
        .frame-goldcloud {
            position: relative;
            border-radius: 50%;
            border: none;
        }
        /* Goldcloud头像框 - 未展开状态：框要比头像大，让金圈包住头像而非在头像内 */
        .frame-goldcloud::before {
            content: "";
            position: absolute;
            /* 未展开头像 64px，框放大到完全盖住头像白边，金圈为最外缘 */
            inset: -40px;
            background-image: url('/img/ringframe/Goldcloud.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            pointer-events: none;
            animation: goldcloud-float 3s ease-in-out infinite;
            opacity: 1;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
        /* 头像框呼吸浮动动画 */
        @keyframes goldcloud-float {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 3px rgba(212, 175, 55, 0.4)); }
            50% { transform: scale(1.02) rotate(1deg); filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.7)); }
        }
        /* 展开过程中头像框淡出并缩放消失 */
        .frame-goldcloud.collapsing::before {
            animation: goldcloud-collapse 0.4s ease-out forwards;
        }
        @keyframes goldcloud-collapse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        /* 展开过程中头像框淡入并放大出现 */
        .frame-goldcloud.expanding::before {
            animation: goldcloud-expand 0.4s ease-out forwards;
        }
        @keyframes goldcloud-expand {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.7; transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* 展开后卡片内小头像框 - 小头像 32px，框放大到完全盖住头像白边 */
        .frame-goldcloud.expanded::before {
            inset: -20px;
            animation: goldcloud-glow 2s ease-in-out infinite;
        }
        @keyframes goldcloud-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5)); }
            50% { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.9)); }
        }
        /* Goldcloud头像框遮罩，确保头像在框内正确显示 */
        .frame-goldcloud .avatar-mask {
            position: relative;
            border-radius: 50%;
            overflow: hidden;
        }

        /* --- Kissofaurora 头像框样式 (极光之吻 • 多彩幻梦动态头像框) --- */
        .frame-kissofaurora {
            position: relative;
            border-radius: 50%;
            border: none;
        }
        /* 极光头像框 - 未展开状态：框放大到完全盖住头像白边 */
        .frame-kissofaurora::before {
            content: "";
            position: absolute;
            inset: -56px;
            background-image: url('/img/ringframe/Kissofaurora.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            pointer-events: none;
            opacity: 1;
        }
        /* 展开过程中头像框淡出并缩放消失 */
        .frame-kissofaurora.collapsing::before {
            animation: aurora-collapse 0.4s ease-out forwards;
        }
        @keyframes aurora-collapse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        /* 展开过程中头像框淡入并放大出现 */
        .frame-kissofaurora.expanding::before {
            animation: aurora-expand 0.4s ease-out forwards;
        }
        @keyframes aurora-expand {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.7; transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* 展开后卡片内小头像框：框放大到完全盖住头像白边 */
        .frame-kissofaurora.expanded::before {
            inset: -29px;
        }

        /* --- 财富满贯·点金之翼荣耀头像框 (GoldMoneyrain) --- */
        .frame-goldmoneyrain {
            position: relative;
            border-radius: 50%;
            border: none;
        }
        /* 点金头像框 - 未展开状态：框放大到完全盖住头像白边 */
        .frame-goldmoneyrain::before {
            content: "";
            position: absolute;
            inset: -12px;
            background-image: url('/img/ringframe/GoldMoneyrain.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

            height: 100%;
            overflow: hidden;
            pointer-events: none;

        .firefly {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0.4vw; /* 保持原版比例 */
            height: 0.4vw;
            margin: -0.2vw 0 0 9.8vw; /* 关键偏移，配合旋转产生大圆周运动 */
            animation: firefly-move 200s alternate infinite; /* 极慢的随机运动 */
        }

        /* 4. 萤火虫光晕与核心 (控制旋转和闪烁) */
        .firefly::before,
        .firefly::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-origin: -10vw; /* 关键：设置旋转中心在远处 */
        }

            background: black; /* 核心 */
            opacity: 0.4;
            animation: firefly-drift 10s ease alternate infinite;
        }

            background: white; /* 发光体 */
            opacity: 0;
            box-shadow: 0 0 0vw 0vw yellow;
            /* 叠加旋转漂移和呼吸闪烁 */

        @keyframes firefly-move {
            0% { transform: translateX(0vw) translateY(0vh) scale(1); }

            25% { transform: translateX(-30vw) translateY(-20vh) scale(1.2); }

            70% { transform: translateX(35vw) translateY(-10vh) scale(0.7); }

            100% { transform: translateX(0vw) translateY(0vh) scale(0.9); }

        }

            15% { opacity: 1; transform: translateY(0) scale(1); }
            70% { opacity: 1; transform: translateY(-6px) scale(1); }
            100% { opacity: 0; transform: translateY(-22px) scale(0.85); }
        }
        .purchase-toast-animate {
            animation: purchaseToastFloat 2s ease-out forwards;
        }
        @keyframes purchaseToastFade {
            0% { opacity: 0; transform: translateY(2px); }
            15% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-4px); }
        }
        .purchase-toast-animate-slow {
            animation: purchaseToastFade 2.5s ease-out forwards;
        }
        /* ===== 应用内通知 Toast 系统 ===== */
        .toast-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 115;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 8px;
            padding: 0 16px 20px;
            pointer-events: none;
        }
        @media (min-width: 1024px) {
            .toast-container {
                left: auto;
                right: 24px;
                bottom: 24px;
                align-items: flex-end;
            }
        }
        .toast-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 14px 14px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08), inset -1px -1px 0 0 var(--toast-glow-inner);
            pointer-events: auto;
            will-change: transform, opacity;
            overflow: hidden;
            border-left: 3.5px solid var(--toast-accent);
        }
        .toast-card::before {
            content: "";
            position: absolute;
            left: -20px;
            top: -20px;
            bottom: -20px;
            width: 60px;
            background: radial-gradient(ellipse at center, var(--toast-glow-outer) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        .toast-icon-wrap {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--toast-icon-bg);
            box-shadow: 0 0 0 3px var(--toast-icon-ring);
            margin-top: 1px;
        }
        .toast-icon-wrap svg { width: 17px; height: 17px; color: var(--toast-icon-color); }
        .toast-progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0,0,0,0.04);
            border-radius: 0 0 16px 16px;
            overflow: hidden;
        }
        .toast-progress-bar {
            height: 100%;
            border-radius: 0 0 16px 16px;
            background: var(--toast-accent);
            opacity: 0.55;
            animation: toastProgressShrink var(--toast-duration) linear forwards;
            will-change: transform;
            transform-origin: left;
        }
        @keyframes toastProgressShrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        @keyframes toastBounceIn {
            0%   { opacity: 0; transform: translateY(36px) scale(0.92); }
            50%  { opacity: 1; transform: translateY(-6px) scale(1.02); }
            75%  { transform: translateY(3px) scale(0.99); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastFadeOut {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(14px) scale(0.95); }
        }
        .toast-enter { animation: toastBounceIn 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) forwards; }
        .toast-exit { animation: toastFadeOut 0.3s ease-in forwards; pointer-events: none; }
        .toast-type-success { --toast-accent: #10b981; --toast-glow-inner: rgba(16,185,129,0.08); --toast-glow-outer: rgba(16,185,129,0.18); --toast-icon-bg: rgba(16,185,129,0.13); --toast-icon-ring: rgba(16,185,129,0.2); --toast-icon-color: #10b981; }
        .toast-type-error { --toast-accent: #f43f5e; --toast-glow-inner: rgba(244,63,94,0.08); --toast-glow-outer: rgba(244,63,94,0.18); --toast-icon-bg: rgba(244,63,94,0.12); --toast-icon-ring: rgba(244,63,94,0.2); --toast-icon-color: #f43f5e; }
        .toast-type-warning { --toast-accent: #f59e0b; --toast-glow-inner: rgba(245,158,11,0.08); --toast-glow-outer: rgba(245,158,11,0.18); --toast-icon-bg: rgba(245,158,11,0.12); --toast-icon-ring: rgba(245,158,11,0.2); --toast-icon-color: #f59e0b; }
        .toast-type-info { --toast-accent: #0ea5e9; --toast-glow-inner: rgba(14,165,233,0.08); --toast-glow-outer: rgba(14,165,233,0.18); --toast-icon-bg: rgba(14,165,233,0.12); --toast-icon-ring: rgba(14,165,233,0.2); --toast-icon-color: #0ea5e9; }
        /* ===== Toast 系统样式结束 ===== */
        @keyframes blinkReminder {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .blink-reminder {
            animation: blinkReminder 1.2s ease-in-out infinite;
        }

        /* ===== 任务设置：展开/收起过渡 ===== */
        @keyframes taskCardIn {
            from { opacity: 0; transform: translateY(-4px) scale(0.985); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .task-card-enter { animation: taskCardIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: top center; }
        @keyframes taskRowIn {
            from { opacity: 0; transform: translateY(3px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .task-row-enter { animation: taskRowIn 0.18s ease-out; }
        /* 新增任务弹窗：窄屏从底部滑出（bottom sheet），宽屏用卡片淡入 */
        @keyframes sheetSlideIn {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        .task-sheet { animation: sheetSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
        @media (min-width: 640px) {
            .task-sheet { animation: taskCardIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        }
        .low-perf-mode .task-card-enter,
        .low-perf-mode .task-row-enter,
        .low-perf-mode .task-sheet { animation: none !important; }

        /* ===== 低性能模式样式（老旧设备兼容与视觉保真） ===== */
        /* 为模态框/弹出层提供不透明背景替代，避免旧浏览器透明穿透 */
        .low-perf-mode .backdrop-blur-fallback {
            background-color: rgba(0, 0, 0, 0.85) !important;
        }
        /* 仅减免极高负载的无限循环动效，保留微交互与弹窗渐入展示 */
        .low-perf-mode .npc-float,
        .low-perf-mode .animate-flame-flicker {
            animation: none !important;
        }
        /* 当老旧设备不支持或渲染 backdrop-filter 模糊卡顿时，关闭毛玻璃滤镜并强化实体高对比度底色 */
        .low-perf-mode .backdrop-blur-md,
        .low-perf-mode .backdrop-blur-sm,
        .low-perf-mode .backdrop-blur-xs {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* 宠物专用动画 */
        @keyframes pet-wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        @keyframes pet-bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pet-eat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(3deg); }
        }
        @keyframes pet-sleep-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(3px) rotate(2deg); }
        }
        @keyframes pet-sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }
        .animate-pet-wiggle { animation: pet-wiggle 0.5s ease-in-out; }
        .animate-pet-bounce-gentle { animation: pet-bounce-gentle 1.5s ease-in-out infinite; }
        .animate-pet-eat { animation: pet-eat 0.4s ease-in-out; }
        .animate-pet-sleep-bob { animation: pet-sleep-bob 3s ease-in-out infinite; }
        .animate-pet-sparkle { animation: pet-sparkle 1s ease-in-out; }

        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }

    </style>
</head>

    <!-- 低性能设备自动检测（在 React 渲染前执行） -->
    <script>
        (function() {
            // 自动检测信号
            var signals = 0;
            var cores = navigator.hardwareConcurrency || 4;
            if (cores <= 2) signals++;
            var mem = navigator.deviceMemory || 8;
            if (mem <= 4) signals++;
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl');
                if (gl) {
                    var renderer = gl.getParameter(gl.RENDERER) || '';
                    var weakGPU = /Intel.*(HD|UHD)\s*(2000|3000|4000|5000|510|515|520|530|6000|615|620)/i.test(renderer);
                    if (weakGPU) signals++;
                    var ext = gl.getExtension('WEBGL_lose_context');
                    if (ext) ext.loseContext();
                }
            } catch(e) {}

            var manualOverride = localStorage.getItem('low_perf_manual');
            var fpsDone = false;
            var fpsLow = false;
            var frameCount = 0;
            var startTime = performance.now();

            function applyResult() {
                if (fpsLow) signals++;
                var autoPerf = signals >= 2;
                window.__lowPerfAuto = autoPerf;
                window.__lowPerfSignals = signals;
                var effective = manualOverride === 'true' ? true : (manualOverride === 'false' ? false : autoPerf);
                window.__lowPerf = effective;
                document.body.classList.toggle('low-perf-mode', effective);
            }

            // 立即基于核心硬件做首屏快速判定，消除 2~3 秒感知延迟
            var initialAuto = signals >= 2;
            window.__lowPerfAuto = initialAuto;
            window.__lowPerfSignals = signals;
            var initialEffective = manualOverride === 'true' ? true : (manualOverride === 'false' ? false : initialAuto);
            window.__lowPerf = initialEffective;
            document.body.classList.toggle('low-perf-mode', initialEffective);

            function countFrame() {
                frameCount++;
                var elapsed = performance.now() - startTime;
                if (elapsed < 2000) {
                    requestAnimationFrame(countFrame);
                } else {
                    var fps = frameCount / (elapsed / 1000);
                    fpsLow = fps < 24;
                    fpsDone = true;
                    applyResult();
                }
            }
            requestAnimationFrame(countFrame);

            setTimeout(function() {
                if (!fpsDone) {
                    fpsDone = true;
                    applyResult();
                }
            }, 3000);
        })();
    </script>
